[project]
name = "trivial-transcoder"
version = "0.1.0"
description = "A simple Jellyfin video transcoder app built with Solara."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.135.1",
  "loguru>=0.7.3",
  "psutil>=7.2.2",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
]

[project.scripts]
trivial-transcoder = "trivial_transcoder.main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/trivial_transcoder"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # missing-trailing-comma
  "D",  # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "prek>=0.3.8",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]
