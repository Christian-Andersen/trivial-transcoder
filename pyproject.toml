[project]
name = "trivial-transcoder"
version = "0.1.0"
description = "A simple Jellyfin video transcoder app built with Solara."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.135.1",
  "loguru>=0.7.3",
  "psutil>=7.2.2",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
]

[project.scripts]
trivial-transcoder = "trivial_transcoder.main:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma
  "D",      # docstrings
  "CPY",    # copyright
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
  "ruff>=0.15.8",
  "ty>=0.0.26",
]
