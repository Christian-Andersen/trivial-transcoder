services:
  transcoder:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID}
      - JELLYFIN_PATH_PREFIX=/jellyfin/media
      - APP_PATH_PREFIX=/media
      - CACHE_DIR=/cache
      - PRESET=4
      - CRF=25
      - GRAIN=10
      - THEME_DARK=true
    volumes:
      - /path/to/jellyfin/media:/jellyfin/media:ro
      - /path/to/local/media:/media
      - transcoder-cache:/cache
    restart: unless-stopped
    # user: "1000:1000"  # uncomment to run as specific user

volumes:
  transcoder-cache:
